<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anwesenheit – FF Ebringen</title>
  <meta name="theme-color" content="#d32f2f">
  <style>
    :root { --rot: #d32f2f; --rot-dunkel: #c62828; --rot-hell: #ffebee; --grau: #495057; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px 12px; max-width: 680px; margin: auto; background: #e9ecef; color: #333; }
    .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.1); border-top: 6px solid var(--rot); }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo img { max-width: 100%; height: auto; max-height: 90px; }

    .form-group { margin-bottom: 20px; }
    label.lbl { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--grau); }
    .req { color: var(--rot); }
    input[type="text"], input[type="date"], input[type="time"], select, textarea {
      width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; font-family: inherit; background: #fff; color: #333; }
    input:focus, select:focus, textarea:focus { border-color: var(--rot); outline: none; box-shadow: 0 0 0 3px rgba(211,47,47,.12); }
    textarea { resize: vertical; }
    .invalid { border-color: var(--rot) !important; background: #fff8f8 !important; }

    .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
    .flex-row > div { flex: 1; min-width: 140px; }

    .att-head { display: flex; justify-content: space-between; align-items: baseline; }
    .counter { font-size: 13px; color: #777; font-weight: normal; }
    .attendee-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; background: #f8f9fa; padding: 14px; border-radius: 8px; border-left: 4px solid var(--rot); box-shadow: 0 2px 4px rgba(0,0,0,.05); position: relative; }
    .attendee-row select { flex: 1; min-width: 140px; padding: 10px; }
    .as-box { display: flex; align-items: center; justify-content: center; gap: 8px; flex-basis: 100%; font-size: 14px; font-weight: bold; color: var(--rot); background: var(--rot-hell); padding: 9px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #ffcdd2; user-select: none; }
    .as-box input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--rot); margin: 0; }
    .as-box.on { background: var(--rot); color: #fff; border-color: var(--rot); }
    .as-box.on input { accent-color: #fff; }

    button { background: linear-gradient(135deg, #e53935, var(--rot-dunkel)); color: #fff; border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 14px; border-radius: 6px; width: 100%; margin-top: 6px; transition: transform .1s, box-shadow .2s; font-family: inherit; }
    button:hover { box-shadow: 0 4px 10px rgba(211,47,47,.3); }
    button:active { transform: translateY(2px); }
    button:disabled { background: #9e9e9e; cursor: not-allowed; box-shadow: none; transform: none; }
    .add-btn { background: #e0e0e0; color: #333; }
    .add-btn:hover { background: #d5d5d5; box-shadow: none; }
    .remove-btn { position: absolute; top: -10px; right: -10px; background: #fff; color: var(--rot); font-size: 15px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rot); display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
    .remove-btn:hover { background: var(--rot); color: #fff; }

    #message { display: none; text-align: center; font-weight: bold; margin-bottom: 18px; font-size: 15px; padding: 12px; border-radius: 6px; }
    #message.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    #message.err { display: block; background: var(--rot-hell); color: var(--rot-dunkel); }
    #loading { text-align: center; color: #666; padding: 20px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #ddd; border-top-color: var(--rot); border-radius: 50%; margin: 0 auto 10px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; font-size: 12px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>

  <div id="loading"><div class="spinner"></div>Lade Daten vom Server …</div>
  <div id="message"></div>

  <form id="form" style="display:none;" novalidate>
    <div class="form-group">
      <label class="lbl" for="topic">Thema der Übung / des Einsatzes <span class="req">*</span></label>
      <input type="text" id="topic" placeholder="z.B. THL-Übung, Brandeinsatz …" autocomplete="off">
    </div>

    <div class="form-group flex-row">
      <div>
        <label class="lbl" for="date">Datum <span class="req">*</span></label>
        <input type="date" id="date">
      </div>
      <div>
        <label class="lbl" for="startTime">Beginn <span class="req">*</span></label>
        <input type="time" id="startTime">
      </div>
      <div>
        <label class="lbl" for="endTime">Ende <span class="req">*</span></label>
        <input type="time" id="endTime">
      </div>
    </div>

    <div class="form-group">
      <label class="lbl" for="leader">Übungsleiter / Einsatzleiter <span class="req">*</span></label>
      <select id="leader"></select>
    </div>

    <div class="form-group">
      <label class="lbl att-head">
        <span>Anwesende Kameraden, Funktionen &amp; Fahrzeuge <span class="req">*</span></span>
        <span class="counter" id="counter"></span>
      </label>
      <div id="attendees"></div>
      <button type="button" class="add-btn" id="addBtn">+ Weiteren Kameraden hinzufügen</button>
    </div>

    <div class="form-group">
      <label class="lbl" for="notes">Sonstige Bemerkungen</label>
      <textarea id="notes" rows="3" placeholder="Besondere Vorkommnisse, defekte Ausrüstung (optional)"></textarea>
    </div>

    <button type="submit" id="submitBtn">Dienst speichern &amp; PDF senden</button>
  </form>
</div>
<div class="footer">Freiwillige Feuerwehr Ebringen · Dienstdokumentation</div>

<script>
  // ==========================================================================
  // URL der veröffentlichten Apps-Script-Web-App (Bereitstellung → Web-App)
  // ==========================================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxdfFwc3Y_4t2a67TIhLbwDM7rzUmzZY67X7FH8d0GYF_Hz-K-h9jlfeugWPRuTClo/exec";

  const SUBMIT_TEXT = "Dienst speichern & PDF senden";
  let settings = { kameraden: [], leiter: [], funktionen: [], fahrzeuge: [] };

  const $ = id => document.getElementById(id);

  // ---------- Hilfsfunktionen ----------
  function todayIso() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fillSelect(select, placeholder, values) {
    select.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = ""; ph.textContent = placeholder;
    select.appendChild(ph);
    values.forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      select.appendChild(o);
    });
  }

  function showMessage(text, ok) {
    const m = $("message");
    m.textContent = text;
    m.className = ok ? "ok" : "err";
    m.scrollIntoView({ behavior: "smooth", block: "center" });
    clearTimeout(showMessage.t);
    if (ok) showMessage.t = setTimeout(() => { m.className = ""; }, 8000);
  }

  // ---------- Anwesende ----------
  function addAttendee() {
    const row = document.createElement("div");
    row.className = "attendee-row";

    const name = document.createElement("select");
    name.className = "att-name";
    fillSelect(name, "Name", settings.kameraden);

    const role = document.createElement("select");
    role.className = "att-role";
    fillSelect(role, "Funktion", settings.funktionen);

    const vehicle = document.createElement("select");
    vehicle.className = "att-vehicle";
    fillSelect(vehicle, "Fahrzeug", settings.fahrzeuge);

    const as = document.createElement("label");
    as.className = "as-box";
    as.innerHTML = '<input type="checkbox" class="att-as"> Atemschutz';
    as.querySelector("input").addEventListener("change", e => as.classList.toggle("on", e.target.checked));

    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "remove-btn"; rm.title = "Entfernen"; rm.textContent = "✖";
    rm.addEventListener("click", () => {
      row.remove();
      if (!document.querySelector(".attendee-row")) addAttendee();
      refreshNames();
    });

    name.addEventListener("change", () => { name.classList.remove("invalid"); refreshNames(); });

    row.append(name, role, vehicle, as, rm);
    $("attendees").appendChild(row);
    refreshNames();
    return row;
  }

  // Bereits gewählte Namen in den anderen Zeilen ausblenden + Zähler aktualisieren
  function refreshNames() {
    const selects = [...document.querySelectorAll(".att-name")];
    const chosen = selects.map(s => s.value).filter(Boolean);
    selects.forEach(s => {
      [...s.options].forEach(o => {
        if (!o.value) return;
        const taken = chosen.includes(o.value) && s.value !== o.value;
        o.disabled = taken;
        o.hidden = taken;
      });
    });
    const n = chosen.length;
    $("counter").textContent = n ? n + (n === 1 ? " Kamerad" : " Kameraden") : "";
  }

  // ---------- Laden ----------
  function loadSettings() {
    fetch(API_URL + "?action=getSettings")
      .then(r => r.json())
      .then(res => {
        if (res.status !== "success") throw new Error(res.message || "Unbekannter Fehler");
        settings = res.data;
        const leiter = settings.leiter.length ? settings.leiter : settings.kameraden;
        fillSelect($("leader"), "Bitte wählen …", leiter);
        $("date").value = todayIso();
        addAttendee();
        $("loading").style.display = "none";
        $("form").style.display = "block";
      })
      .catch(err => {
        console.error(err);
        $("loading").innerHTML = "Fehler beim Laden der Daten.<br>Bitte Seite neu laden.";
      });
  }

  // ---------- Absenden ----------
  function submitForm(ev) {
    ev.preventDefault();
    document.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));

    const fields = ["topic", "date", "startTime", "endTime", "leader"];
    const missing = fields.filter(id => !$(id).value.trim());
    missing.forEach(id => $(id).classList.add("invalid"));

    const attendees = [...document.querySelectorAll(".attendee-row")]
      .map(row => ({
        name: row.querySelector(".att-name").value,
        role: row.querySelector(".att-role").value,
        vehicle: row.querySelector(".att-vehicle").value,
        atemschutz: row.querySelector(".att-as").checked
      }))
      .filter(a => a.name);

    // Zeilen mit Funktion/Fahrzeug/AS aber ohne Namen markieren
    let halbe = 0;
    document.querySelectorAll(".attendee-row").forEach(row => {
      const n = row.querySelector(".att-name");
      const filled = row.querySelector(".att-role").value || row.querySelector(".att-vehicle").value || row.querySelector(".att-as").checked;
      if (!n.value && (filled || attendees.length === 0)) { n.classList.add("invalid"); halbe++; }
    });

    if (missing.length || attendees.length === 0 || halbe) {
      showMessage(attendees.length === 0
        ? "Bitte mindestens einen Kameraden auswählen und alle Pflichtfelder ausfüllen."
        : halbe ? "Bitte in jeder ausgefüllten Zeile einen Namen wählen (oder die Zeile entfernen)."
        : "Bitte alle Pflichtfelder (*) ausfüllen.", false);
      return;
    }

    const payload = {
      topic: $("topic").value.trim(),
      date: $("date").value,
      startTime: $("startTime").value,
      endTime: $("endTime").value,
      leader: $("leader").value,
      notes: $("notes").value.trim(),
      attendees: attendees
    };

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Bericht wird erstellt & gesendet …";

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // vermeidet CORS-Preflight
      body: JSON.stringify({ action: "saveData", payload: payload })
    })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          showMessage(res.message, true);
          $("form").reset();
          $("date").value = todayIso();
          $("attendees").innerHTML = "";
          addAttendee();
        } else {
          showMessage("Fehler: " + res.message, false);
        }
      })
      .catch(err => {
        console.error(err);
        showMessage("Verbindungsfehler – bitte erneut versuchen. Falls der Fehler bleibt, prüfen ob die Mail trotzdem angekommen ist, bevor du erneut sendest.", false);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = SUBMIT_TEXT;
      });
  }

  $("addBtn").addEventListener("click", addAttendee);
  $("form").addEventListener("submit", submitForm);
  // Enter in Eingabefeldern soll nicht versehentlich absenden
  $("form").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.tagName === "INPUT") e.preventDefault();
  });
  ["topic", "date", "startTime", "endTime", "leader"].forEach(id =>
    $(id).addEventListener("input", () => $(id).classList.remove("invalid")));

  loadSettings();
</script>
</body>
</html>
